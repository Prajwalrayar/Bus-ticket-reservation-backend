spring.application.name=busticketbooking

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/busticketing
spring.datasource.username=root
spring.datasource.password=Prajwal@0103
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Seed data (runs once on first start, safe with IF NOT EXISTS or TRUNCATE approach)
spring.sql.init.mode=never

# ── JWT ───────────────────────────────────────────────────────
jwt.secret=Y3JpbXNvbkxvZ2ljQnVzVGlja2V0Qm9va2luZ1N5c3RlbVNlY3JldEtleTIwMjU=
jwt.expiration=1800000
jwt.refresh.expiration=604800000

# ── Seat Locking ──────────────────────────────────────────────
seat.lock.timeout.minutes=10

# ── API Docs (Swagger) ────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Cache (simple in-memory - no Redis required) ──────────────
spring.cache.type=simple

# ── CORS ─────────────────────────────────────────────────────
cors.allowed.origins=http://localhost:4200

# ── Cancellation refund rules ─────────────────────────────────
cancellation.refund.full.hours=24
cancellation.refund.full.percentage=90
cancellation.refund.partial.hours=12
cancellation.refund.partial.percentage=50
# Below 12 hours = 0% refund

# ── Booking ───────────────────────────────────────────────────
booking.tax.percentage=5.00

# ── Logging ───────────────────────────────────────────────────
logging.level.com.crimsonlogic.busticketbooking=INFO
logging.level.org.springframework.security=WARN

# ── Spring AI (OpenAI) ────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY:mock_key}
spring.ai.openai.chat.options.model=gpt-3.5-turbo

# ── AI Scoring Weights ────────────────────────────────────────
ai.scoring.weight.price=-1.0
ai.scoring.weight.duration=-2.0
ai.scoring.weight.transfers=-15.0
ai.scoring.weight.preference=10.0

# ── AI Dynamic Pricing Simulation ──────────────────────────────
ai.pricing.multiplier.medium=1.15
ai.pricing.multiplier.high=1.35
ai.pricing.threshold.scarcity=5
ai.pricing.multiplier.scarcity=1.1

